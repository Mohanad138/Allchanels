name: Unified Relay Bot (all channels)

on:
  schedule:
    - cron: "*/10 * * * *"   # احتياطي فقط — إذا توقف المُشغّل الخارجي لأي سبب، يضل فيه تشغيل احتياطي كل 10 دقائق
  workflow_dispatch:
  repository_dispatch:
    types: [run-all-channels] # يُشغَّل عبر طلب خارجي (cron-job.org) — تم تغيير الاسم ليتناسب مع هذا المستودع

concurrency:
  group: relay-all-channels
  cancel-in-progress: false   # يمنع تشغيلين متزامنين

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6        # تم تقليله لأن البوت أصبح أسرع ولن يحتاج أكثر من ذلك
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"

      - name: Run bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GEMINI_KEY_SHAKO: ${{ secrets.GEMINI_KEY_SHAKO }}
          GEMINI_KEY_TECH: ${{ secrets.GEMINI_KEY_TECH }}
          GEMINI_KEY_GENERAL: ${{ secrets.GEMINI_KEY_GENERAL }}
          GEMINI_KEY_HADAF: ${{ secrets.GEMINI_KEY_HADAF }}
          GEMINI_KEY_MEDIA: ${{ secrets.GEMINI_KEY_MEDIA }}
          GEMINI_KEY_GTA: ${{ secrets.GEMINI_KEY_GTA }}
        run: python main.py
